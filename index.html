<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>Cadastre seu veículo para vender mais rápido!</h3>
        </div>
        <form>
            <div class="form-container">
            <div class="form-header">
                <p>Formulario</p>
            </div>
            <div class="form-body">
                <h1 class="form-title">Venda fácil o seu carro!</h1>
                <p>Descreva as característica e marque os opcionais que ele possui.</p>
                <div class="box-input">
                    <label for="title">Titulo do anuncio <span class="required-field">*</span></label>
                    <input type="text" name="title" id="title" class="block" placeholder="Um título para anúnciar seu carro" minlength="1" maxlength="30"
                    required>
                </div>
                <input type="submit" value="Enviar">
            </div>
        </form>
        </div>
    </div>
</body>
</html>
