<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>Cadastre seu veiculo para vender mais rápido!</h3>
        </div>
        <div class="form-container">
            <div class="form-header">
                <p>Formulário</p>
            </div>
            <form>
                <div class="form-body">
                <h1 class="form-title">Venda facil o seu carro</h1>
                <p>
                    descreva as características e marque os opcionais que ele possui.
                </p>
                <div class="box-input">
                    <label for="title">Título do anúncio <span class="required-field">*</span></label>
                    <input type="text" name="title" id="title" class="block" placeholder="Um título para anúnciar seu carro" minlength="1" maxlength="30" required>
                </div>
                 <div class="box-input">
                    <label for="price">Preço <span class="required-field">*</span></label>
                    <input type="number" name="price" id="price" class="block" placeholder="Defina um preço" required>
                </div>
                <div class="box-input">
                    <label for="description">Descrição <span class="required-field">*</span></label>
                    <textarea name="description" id="description" class="block" placeholder="Aqui você colocar os detalhes do veículo, por exemplo: se ele tem um arranhão"></textarea>
                </div>
                 <div class="box-input">
                    <label for="brand">Marca <span class="required-field">*</span></label>
                    <input type="text" name="brand" id="brand" class="block" placeholder="Digite a marca do carro" required>
                </div>
                 <div class="box-input">
                    <label for="model">Modelo <span class="required-field">*</span></label>
                    <input type="text" name="model" id="model" class="block" placeholder="Digite o modelo do veiculo" required>
                </div>
                 <div class="box-input">
                    <label for="mileage">Quilometragem <span class="required-field">*</span></label>
                    <input type="text" name="mileage" id="mileage" class="block" placeholder="Digite a quilometragem do veículo" required>
                </div>
                 <div class="box-input">
                    <label for="purchase-date">Data de compra <span class="required-field">*</span></label>
                    <input type="date" name="purchase-date" id="purchase-date" class="block" required>
                </div>
                 <div class="box-input">
                    <p>Tipo de câmbio: <span class="required-field">*</span></p>
                    <input type="radio" name="gerar" id="manual">
                    <label for="manual">Manual</label>
                    <input type="radio" name="gerar" id="automatic">
                    <label for="auto">Automatico</label>
                </div>
                 <div class="Options-box">
                    <p>Opcionais</p>
                    <ul class="optional-list">
                        <li>
                            <input type="checkbox" id="airbag" name="optional[]" value="airbag">
                            <label for="airbag">Airbag</label>
                        </li>
                        <li>
                            <input type="checkbox" id="ac" name="optional[]" value="ac">
                            <label for="ac">Ar Condicionado</label>
                        </li>
                            <input type="checkbox" id="reverse-camera" name="optional[]" value="reverse-camera">
                            <label for="reverse-camera">Câmera de Ré</label>
                        </li>
                    </ul>
                </div>
                <div class="Options-box">
                    <ul class="optional-list">
                        <li>
                            <input type="checkbox" id="lane-assist" name="optional[]" value="lane-assist">
                            <label for="lane-assist">Assistente de Pista</label>
                        </li>
                        <li>
                            <input type="checkbox" id="keyless" name="optional[]" value="keyless">
                            <label for="keyless">Entrada Sem Chave</label>
                        </li>
                            <input type="checkbox" id="smartphone" name="optional[]" value="smartphone">
                            <label for="smartphone">Integração com smartphone</label>
                        </li>
                        <li>
                            <input type="checkbox" id="leather-seat" name="optional[]" value="leather-seat">
                            <label for="leather-seat">Banco de Couro</label>
                        </li>
                    </ul>
                </div>
                <input type="submit" value="Enviar">
                <div class="box-input">
                    <p>Fotos do carros: <span class="required-field">*</span></p>
                    <input type="file" multiple accept="image/png, image/png" id="images" name="images" required>
                </div>
            </form>
            </div>
        </div>
    </div>
</body>
</html>
