<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>Cadastre seu veiculo para vender mais rápido!</h3>
        </div>
        <div class="form-container">
            <div class="form-header">
                <p>Formulário</p>
            </div>
            <form>
                <div class="form-body">
                <h1 class="form-title">Venda facil o seu carro</h1>
                <p>
                    descreva as características e marque os opcionais que ele possui.
                </p>
                <div class="box-input">
                    <label for="title">Título do anúncio <span class="required-field">*</span></label>
                    <input type="text" name="title" id="title" class="block" placeholder="Um título para anúnciar seu carro" minlength="1" maxlength="30" required>
                </div>
                 <div class="box-input">
                    <label for="price">Preço <span class="required-field">*</span></label>
                    <input type="number" name="price" id="price" class="block" placeholder="Defina um preço" required>
                </div>
                <div class="box-input">
                    <label for="description">Descrição <span class="required-field">*</span></label>
                    <textarea name="description" id="description" class="block" placeholder="Aqui você colocar os detalhes do veículo, por exemplo: se ele tem um arranhão"></textarea>
                </div>
                 <div class="box-input">
                    <label for="brand">Marca <span class="required-field">*</span></label>
                    <input type="text" name="brand" id="brand" class="block" placeholder="Digite a marca do carro" required>
                </div>
                 <div class="box-input">
                    <label for="model">Modelo <span class="required-field">*</span></label>
                    <input type="text" name="model" id="model" class="block" placeholder="Digite o modelo do veiculo" required>
                </div>
                 <div class="box-input">
                    <label for="mileage">Quilometragem <span class="required-field">*</span></label>
                    <input type="text" name="mileage" id="mileage" class="block" placeholder="Digite a quilometragem do veículo" required>
                </div>
                 <div class="box-input">
                    <label for="purchase-date">Data de compra <span class="required-field">*</span></label>
                    <input type="date" name="purchase-date" id="purchase-date" class="block" required>
                </div>
                <input type="submit" value="Enviar">
            </form>
            </div>
        </div>
    </div>
</body>
</html>
